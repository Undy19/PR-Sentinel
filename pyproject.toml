[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-sentinel"
version = "0.1.0"
description = "Telegram bot for automated PR review filtering"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4",
    "fastapi>=0.100,<1",
    "uvicorn>=0.23,<1",
    "httpx>=0.24,<1",
    "openai>=1.0,<2",
    "PyGithub>=2.0,<3",
    "aiosqlite>=0.19,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<8",
    "ruff>=0.4,<1",
    "mypy>=1.8,<2",
    "black>=24,<26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.black]
line-length = 100
target-version = ["py311"]
