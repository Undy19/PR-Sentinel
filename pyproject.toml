[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-sentinel"
version = "0.1.0"
description = "AI-powered pull request risk assessment and reviewer recommendation for GitHub"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Undy19" }
]

license = { file = "LICENSE" }

keywords = [
    "github",
    "pull-request",
    "code-review",
    "ai",
    "telegram",
    "fastapi",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "aiogram>=3.4,<4",
    "fastapi>=0.100,<1",
    "uvicorn>=0.23,<1",
    "httpx>=0.24,<1",
    "openai>=1.0,<2",
    "aiosqlite>=0.19,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/Undy19/pr-sentinel"
Repository = "https://github.com/Undy19/pr-sentinel"
Issues = "https://github.com/Undy19/pr-sentinel/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<8",
    "ruff==0.16.9",
    "mypy>=1.8,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that exercise real git repositories / cross-module flows",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
